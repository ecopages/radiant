<div data-example="video-player">
	<div
		data-stage
		data-state="idle"
		role="group"
		aria-label="Video player"
		aria-describedby="video-player-plain-help"
		tabindex="0"
	>
		<video
			data-video
			data-src="/assets/video/radiant-reel.webm"
			poster="/assets/video/radiant-reel.jpg"
			preload="metadata"
			playsinline
		>
			<track kind="captions" srclang="en" label="English" />
		</video>
		<button
			type="button"
			class="rui-button rui-button--filled rui-button--lg rui-button--square"
			data-big-play
			aria-hidden="true"
			tabindex="-1"
		>
			<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
				<path d="M8 5v14l11-7z" fill="currentColor" />
			</svg>
		</button>
		<span data-spinner aria-hidden="true"></span>
		<div data-error hidden>
			<p data-error-message>Could not load the video</p>
			<button type="button" class="rui-button rui-button--filled rui-button--sm" data-retry>Retry</button>
		</div>
		<div data-controls>
			<button
				type="button"
				class="rui-button rui-button--ghost rui-button--md rui-button--square"
				data-playback
				aria-label="Play"
				aria-pressed="false"
			>
				<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="play">
					<path d="M8 5v14l11-7z" fill="currentColor" /></svg
				><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="pause">
					<path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor" />
				</svg>
			</button>
			<div data-scrub>
				<span data-elapsed>0:00</span>
				<rui-slider data-seek step="0.01" label="Seek" min="0" max="1" value="0" disabled>
					<div class="rui-slider rui-slider--single" data-ref="root">
						<div class="rui-slider__range">
							<div
								class="rui-slider__range-track"
								data-ref="rangeTrack"
								style="--rui-slider-fill-start: 0%; --rui-slider-fill-size: 0%; --rui-slider-value: 0%"
							>
								<div data-buffered aria-hidden="true"></div>
								<div class="rui-slider__range-fill" data-ref="rangeFill"></div>
								<button
									type="button"
									class="rui-slider__thumb"
									data-ref="singleThumb"
									data-thumb="value"
									role="slider"
									aria-label="Seek"
								></button>
							</div>
						</div>
					</div>
				</rui-slider>
				<span data-duration>0:00</span>
			</div>
			<button
				type="button"
				class="rui-button rui-button--ghost rui-button--md rui-button--square"
				data-mute
				aria-label="Mute"
				aria-pressed="false"
			>
				<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="volume">
					<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" />
					<path
						d="M16 9a4 4 0 0 1 0 6"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					/></svg
				><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="muted">
					<path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" />
					<path
						d="M16.5 9.5l5 5M21.5 9.5l-5 5"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
			</button>
			<div data-volume>
				<rui-slider data-volume-input step="0.05" label="Volume" min="0" max="1" value="1">
					<div class="rui-slider rui-slider--single" data-ref="root">
						<div class="rui-slider__range">
							<div
								class="rui-slider__range-track"
								data-ref="rangeTrack"
								style="
									--rui-slider-fill-start: 0%;
									--rui-slider-fill-size: 100%;
									--rui-slider-value: 100%;
								"
							>
								<div class="rui-slider__range-fill" data-ref="rangeFill"></div>
								<button
									type="button"
									class="rui-slider__thumb"
									data-ref="singleThumb"
									data-thumb="value"
									role="slider"
									aria-label="Volume"
								></button>
							</div>
						</div>
					</div>
				</rui-slider>
			</div>
			<button type="button" class="rui-button rui-button--ghost rui-button--md" data-rate aria-label="Speed 1x">
				1x
			</button>
			<button
				type="button"
				class="rui-button rui-button--ghost rui-button--md rui-button--square"
				data-captions
				aria-label="Captions"
				aria-pressed="false"
			>
				<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
					<rect
						x="3"
						y="5"
						width="18"
						height="14"
						rx="2"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
					/>
					<path
						d="M10.5 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
			</button>
			<button
				type="button"
				class="rui-button rui-button--ghost rui-button--md rui-button--square"
				data-fullscreen
				aria-label="Fullscreen"
				aria-pressed="false"
			>
				<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="enter">
					<path
						d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					/></svg
				><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="exit">
					<path
						d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
			</button>
		</div>
		<p data-status aria-live="polite"></p>
	</div>
	<span data-help hidden id="video-player-plain-help"
		>Space or K plays and pauses, J and L skip 10 seconds, the arrows seek 5 seconds or change the volume, M mutes,
		C toggles captions, F toggles fullscreen, 0 to 9 jump through the video, Home and End go to its start and
		end</span
	>
</div>
