<searchable-list-element>
	<label for="fruit-filter">Filter fruit</label>
	<input id="fruit-filter" type="search" placeholder="Type a fruit" />
	<ul role="listbox" aria-label="Fruit">
		<li role="option">Apple</li>
		<li role="option">Apricot</li>
		<li role="option">Banana</li>
		<li role="option">Cherry</li>
		<li role="option">Date</li>
	</ul>
	<p data-status aria-live="polite">5 of 5 shown</p>
</searchable-list-element>
