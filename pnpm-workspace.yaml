packages:
    - 'apps/*'
    - 'packages/*'
    - 'playground/*'

catalog:
    # Lint rules and config typing must use the same Oxlint release.
    oxlint: ^1.78.0
    typescript: ~7.0.2

allowBuilds:
    esbuild: true
    '@swc/core': true
    msw: false

minimumReleaseAgeExclude:
    - '@ecopages/browser-router@0.2.0-rc.13'
    - '@ecopages/content-processor@0.2.0-rc.13'
    - '@ecopages/core@0.2.0-rc.13'
    - '@ecopages/dev-toolbar@0.2.0-rc.13'
    - '@ecopages/ecopages-jsx@0.2.0-rc.13'
    - '@ecopages/file-system@0.2.0-rc.13'
    - '@ecopages/mdx@0.2.0-rc.13'
    - '@ecopages/postcss-processor@0.2.0-rc.13'
    - ecopages@0.2.0-rc.13
