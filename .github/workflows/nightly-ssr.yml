name: Nightly SSR

on:
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:

concurrency:
    group: nightly-ssr-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    radiant-ui-ssr-full:
        name: radiant-ui SSR full matrix
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install chromium --with-deps

            - name: Run Storybook SSR full matrix
              run: pnpm --filter @ecopages/radiant-ui test:ssr
