name: CI

on:
    pull_request:
    push:
        branches:
            - main
            - 'release/**'

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build libraries
              run: pnpm run build:all

            - name: Typecheck
              run: pnpm run typecheck:packages

    radiant-server:
        name: Radiant server tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build libraries
              run: pnpm run build:all

            - name: Install Playwright browsers
              run: pnpm exec playwright install chromium --with-deps

            - name: Run radiant server tests
              run: pnpm --filter @ecopages/radiant test:lib

    radiant-ui-storybook:
        name: radiant-ui Storybook tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install chromium --with-deps

            - name: Run Storybook tests
              run: pnpm --filter @ecopages/radiant-ui test:storybook
